[project]
name = "genetic-health-toolkit"
version = "0.1.0"
description = "Comprehensive genetic health analysis toolkit with FastAPI backend and Next.js frontend"
authors = [
    { name = "Victor Iatco", email = "victoriatco@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.5",
    "alembic>=1.16.4",
    "asyncpg>=0.30.0",
    "bcrypt>=4.0.0",
    "biopython>=1.85",
    "email-validator>=2.2.0",
    "fastapi>=0.116.1",
    "numpy>=2.3.2",
    "pandas>=2.3.2",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.11.7",
    "pysam>=0.23.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "requests>=2.32.5",
    "scikit-learn>=1.7.1",
    "sqlalchemy[asyncio]>=2.0.43",
    "uvicorn>=0.35.0",
    "pyyaml>=6.0",
]

[project.scripts]
genetic-health-toolkit = "genetic_health_toolkit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genetic_health_toolkit", "backend"]
