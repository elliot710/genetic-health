[project]
name = "genetic-health-toolkit"
version = "0.1.0"
description = "Comprehensive genetic health analysis toolkit with FastAPI backend and Next.js frontend"
authors = [
    { name = "Victor Iatco", email = "victoriatco@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.5",
    "alembic>=1.16.4",
    "asyncpg>=0.30.0",
    "bcrypt>=4.0.0",
    "biopython>=1.85",
    "email-validator>=2.2.0",
    "fastapi>=0.116.1",
    "numpy>=2.3.2",
    "pandas>=2.3.2",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.11.7",
    "pysam>=0.23.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "requests>=2.32.5",
    "scikit-learn>=1.7.1",
    "sqlalchemy[asyncio]>=2.0.43",
    "uvicorn[standard]>=0.35.0",
    "websockets>=13.0",
    "pyyaml>=6.0",
    "google-cloud-bigquery>=3.0.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["backend"]
omit = [
    # ORM models and DB engine setup — no executable logic to unit-test
    "backend/db/models.py",
    "backend/db/database.py",
    "backend/db/datasource_models.py",
    "backend/db/annotation_schemas.py",
    # App startup / background worker — integration tests territory
    "backend/main.py",
    "backend/worker.py",
    # File-reading local services — require real data files at runtime
    "backend/services/clinvar_local.py",
    "backend/services/ensembl_vep_local.py",
    "backend/services/gnomad_local.py",
    "backend/services/gnomad_v2_local.py",
    "backend/services/thousand_genomes_local.py",
    "backend/services/alphafold_local.py",
    "backend/utils/alpha_missense.py",
    # ETL pipeline scripts — batch transform utilities
    "backend/services/clinvar_etl.py",
    "backend/services/ensembl_etl.py",
    "backend/services/ensembl_vep_etl.py",
    "backend/services/gnomad_etl.py",
    "backend/services/gnomad_v2_etl.py",
    "backend/services/thousand_genomes_etl.py",
    # External API clients — HTTP/BigQuery calls
    "backend/services/genetic_api_service.py",
    "backend/services/bq_public.py",
    "backend/services/gnomad_bigquery.py",
    "backend/services/api_endpoints.py",
    # JWT / bcrypt / telemetry setup
    "backend/core/auth.py",
    "backend/core/telemetry.py",
    # Test files themselves
    "backend/tests/*",
]

[tool.coverage.report]
skip_empty = true
show_missing = true


[project.scripts]
genetic-health-toolkit = "genetic_health_toolkit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/genetic_health_toolkit", "backend"]
