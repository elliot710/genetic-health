# Prometheus configuration for DNA Toolkit SPM
# Scrapes RED metrics produced by the OpenTelemetry spanmetrics connector.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
