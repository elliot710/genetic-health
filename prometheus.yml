# Prometheus configuration for DNA Toolkit SPM
# Scrapes RED metrics produced by the OpenTelemetry spanmetrics connector.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      # Overwrite container ID hash in `name` with the image short name (e.g. nginx, grafana, backend)
      - source_labels: [image]
        regex: '(?:.*/)([^:/]+)(?::.*)?'
        target_label: name
        replacement: '${1}'
      # Strip registry prefix from image label (docker.io/library/nginx:alpine → nginx:alpine)
      - source_labels: [image]
        regex: '(?:.*/)([^/]+)'
        target_label: image
        replacement: '${1}'

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
